services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hamareherp-php
    ports:
      - "8000:8000"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      # array = in-memory, no Redis extension, no slow file volume I/O
      # switch to redis only after: docker compose build app (with phpredis)
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_LEVEL: warning
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONNECTION: pgsql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - postgres
    networks:
      - hamareh-network
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  postgres:
    image: postgres:16-alpine
    container_name: hamareherp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamareh_saas_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hamareh-network

  redis:
    image: redis:7-alpine
    container_name: hamareherp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hamareh-network
    profiles:
      - redis

networks:
  hamareh-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
