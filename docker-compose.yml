services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: hamareherp-php
    ports:
      - "8000:8000"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Source code from host
      - .:/var/www/html
      # CRITICAL on Docker Desktop (Win/Mac): keep vendor INSIDE the Linux VM.
      # Reading vendor through bind-mount often costs 3–10s per request.
      - hamareh_vendor:/var/www/html/vendor
      - hamareh_bootstrap_cache:/var/www/html/bootstrap/cache
      - hamareh_storage_framework:/var/www/html/storage/framework
    environment:
      CACHE_STORE: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_LEVEL: warning
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONNECTION: pgsql
      BCRYPT_ROUNDS: "10"
    depends_on:
      - postgres
    networks:
      - hamareh-network
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  postgres:
    image: postgres:16-alpine
    container_name: hamareherp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamareh_saas_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hamareh-network

networks:
  hamareh-network:
    driver: bridge

volumes:
  postgres_data:
  hamareh_vendor:
  hamareh_bootstrap_cache:
  hamareh_storage_framework:
